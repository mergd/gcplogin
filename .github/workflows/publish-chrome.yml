name: Publish Chrome Web Store

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      upload_only:
        description: "Upload without submitting for publish/review"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run compile

      - name: Assert tag matches extension version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          EXTENSION_VERSION=$(node -p 'require("./package.json").version')
          echo "tag=$TAG extension=$EXTENSION_VERSION"
          if [ "$TAG" != "$EXTENSION_VERSION" ]; then
            echo "::error::Tag v$TAG must match package.json version ($EXTENSION_VERSION). Bump the package version, commit, then retag."
            exit 1
          fi

      - name: Build zip
        run: npm run zip

      - name: Upload / publish to Chrome Web Store
        env:
          CWS_SERVICE_ACCOUNT_JSON: ${{ secrets.CWS_SERVICE_ACCOUNT_JSON }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
        run: |
          ARGS=(--skip-zip)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.upload_only }}" = "true" ]; then
            ARGS+=(--upload-only)
          fi
          npm run cws:publish -- "${ARGS[@]}"
