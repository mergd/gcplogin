<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GCP Auth Skip</title>
  </head>
  <body>
    <main>
      <header>
        <img src="/icon/48.png" alt="" width="40" height="40" />
        <div>
          <h1>GCP Auth Skip</h1>
          <p id="status">Loading…</p>
        </div>
      </header>

      <label class="toggle-row">
        <span>
          <strong>Auto-login</strong>
          <small>Handle Cloud SDK login pages</small>
        </span>
        <input id="autoLogin" type="checkbox" role="switch" />
      </label>

      <label class="field">
        <span>Account email</span>
        <input
          id="accountEmail"
          type="email"
          inputmode="email"
          autocomplete="username"
          placeholder="First account shown"
        />
        <small>Leave blank to use the first visible account.</small>
      </label>

      <label class="field">
        <span>Password</span>
        <input
          id="accountPassword"
          type="password"
          autocomplete="current-password"
          placeholder="Optional"
        />
        <small>
          Stored only in this Chrome profile. Used when Google asks for a
          password. If a password is saved, passkey screens are skipped.
        </small>
      </label>

      <label class="field">
        <span>Authenticator secret</span>
        <input
          id="totpSecret"
          type="password"
          autocomplete="off"
          spellcheck="false"
          placeholder="Base32 or otpauth URL"
        />
        <small>
          Google Authenticator TOTP secret. Used to fill the 6-digit code.
        </small>
      </label>

      <section class="passkey">
        <span>Passkey</span>
        <p id="passkeyStatus">Loading…</p>
        <div class="actions">
          <button id="armPasskey" type="button">Set up passkey</button>
          <button id="removePasskey" type="button" hidden>Remove</button>
        </div>
        <small>
          Creates a Google passkey stored only in this Chrome profile. After
          arming, add a passkey on the Google page that opens.
        </small>
      </section>

      <p class="note">Changes apply to the next login.</p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
